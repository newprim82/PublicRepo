name: Monthly Team Worklog Report Email

on:
  schedule:
    # 한국 시간(KST) 매달 1일 오전 08:00 (UTC 기준 전월 말일 23:00)
    - cron: '0 23 28-31 * *'
  workflow_dispatch: # GitHub 웹에서 수동 즉시 실행 가능

jobs:
  send-monthly-worklog:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is 1st of month in KST
        id: check_date
        run: |
          KST_DAY=$(TZ=Asia/Seoul date +%d)
          echo "Current KST day: $KST_DAY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$KST_DAY" = "01" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r worktime_dashboard/requirements.txt

      - name: Send Monthly Team Worklog Report Email
        if: steps.check_date.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL || 'newprim82@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_SENDER_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        working-directory: worktime_dashboard
        run: |
          python -m src.scripts.send_monthly_team_worklog
