name: Weekly Executive Summary Email Report

on:
  schedule:
    # 매주 일요일 23:00 UTC == 매주 월요일 08:00 KST
    - cron: '0 23 * * 0'
  workflow_dispatch: # GitHub 웹에서 수동 실행 지원

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl supabase requests

      - name: Send Weekly Report Email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL || 'newprim82@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'Rlarudgus1!' }}
          DEFAULT_RECIPIENT_EMAIL: ${{ secrets.DEFAULT_RECIPIENT_EMAIL || 'ymmoon@sangsanginworld.co.kr' }}
        run: |
          python -m src.scripts.send_weekly_report
